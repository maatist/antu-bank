# Version catalog centralizado — Antu Bank
# Fuente única de versiones para todo el monorepo.

[versions]
java = "21"
junit = "5.11.3"
assertj = "3.26.3"
# Spring Boot 3.3.6 fija Spring Framework 6.1.15, que corrige el bug de headers de request de solo
# lectura (spring-framework #33789): en 3.3.5 (Framework 6.1.14) los headers entrantes pasaron a ser
# ReadOnlyHttpHeaders, rompiendo cualquier filtro del gateway que los mute (TokenRelay y el forward
# de fallback del CircuitBreaker vía setOrigin). 6.1.15 restablece la mutabilidad. Bump de patch,
# bajo riesgo, requerido por la resiliencia del api-gateway (tarea 9.2).
springBoot = "3.3.6"
springDependencyManagement = "1.1.6"
springdoc = "2.6.0"
testcontainers = "1.21.4"
# Release train de Spring Cloud. 2023.0.x (Leyton) es compatible con Spring Boot 3.2.x/3.3.x.
# Se usa la BOM spring-cloud-dependencies (importada vía io.spring.dependency-management) para
# alinear Spring Cloud Gateway, Resilience4j, etc. con Spring Boot 3.3.5 (tarea 9, api-gateway).
#
# Se alinea con Spring Boot 3.3.6 (Framework 6.1.15). El tren 2023.0.4 trae gateway 4.1.6, cuyo
# ForwardedHeadersFilter usa HttpHeaders.headerSet(), método presente desde Framework 6.1.15. Así
# quedan alineados: Boot 3.3.6 + Framework 6.1.15 + Spring Cloud 2023.0.4 (gateway 4.1.6,
# circuitbreaker 3.1.x) — combinación en la que el circuit breaker con fallback funciona sin
# NoSuchMethodError ni el bug de headers de solo lectura (tarea 9.2).
springCloud = "2023.0.4"
# Appender de Logback para Grafana Loki (tarea 11.3, Requisito 11, criterio 4). Envía los logs
# estructurados (JSON) directamente desde cada servicio a Loki vía su API HTTP push, sin acoplar
# los servicios a dónde corren (host o contenedor) — coherente con cómo Prometheus scrapea y los
# servicios exportan trazas OTLP al stack de infra. Se fija la línea 2.0.x, basada en Logback 1.5.x
# (la que trae Spring Boot 3.3.6 es 1.5.12); la 2.1.x exige Logback 1.6.x y no se usa. La 2.0.x
# soporta MDC de primera clase, con lo que traceId/spanId (poblados por Micrometer Tracing en el
# MDC) viajan a Loki para correlacionar logs con trazas por trace-id.
loki4j = "2.0.3"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }

# Spring Boot starters (versiones gestionadas por el plugin de Spring Boot)
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }

# Seguridad: resource server OAuth2/OIDC. Los servicios validan el JWT emitido por Keycloak
# contra el JWKS del realm (tarea 8.2, Requisito 8, criterio 4). La versión la gestiona el BOM
# de Spring Boot. spring-security-test habilita helpers de test (jwt() postprocessor, etc.).
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }

# Mensajería (Kafka). La versión la gestiona el BOM de Spring Boot.
spring-kafka = { module = "org.springframework.kafka:spring-kafka" }
spring-kafka-test = { module = "org.springframework.kafka:spring-kafka-test" }

# Persistencia
postgresql = { module = "org.postgresql:postgresql" }
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }

# Documentación de API
springdoc-openapi-webmvc = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

# API Gateway (Spring Cloud Gateway, reactivo/WebFlux). Enruta el tráfico externo a los servicios
# internos y propaga el token (tarea 9.1, Requisito 9). La BOM spring-cloud-dependencies gestiona
# la versión de estos artefactos; se importa vía io.spring.dependency-management en el módulo.
spring-cloud-dependencies-bom = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "springCloud" }
spring-cloud-starter-gateway = { module = "org.springframework.cloud:spring-cloud-starter-gateway" }

# Resiliencia del gateway (tarea 9.2, Requisito 9, criterio 4). Spring Cloud Circuit Breaker con
# Resilience4j en su variante REACTIVA (reactor): habilita el filtro CircuitBreaker de Spring Cloud
# Gateway y la configuración de instancias Resilience4j (failure rate, wait duration, timeouts). La
# versión la gestiona la BOM spring-cloud-dependencies.
spring-cloud-starter-circuitbreaker-reactor-resilience4j = { module = "org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j" }

# Seguridad reactiva (WebFlux) para el gateway como resource server en el borde. El starter
# oauth2-resource-server trae la variante reactiva cuando el classpath es WebFlux; spring-security-test
# aporta helpers reactivos (mockJwt) para WebTestClient.
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }

# GraphQL BFF del gateway (tarea 9.3, Requisito 9, criterios 5 y 6). Spring for GraphQL funciona
# sobre WebFlux: expone el endpoint HTTP /graphql y, si se habilita, la UI GraphiQL en /graphiql
# como playground. La versión la gestiona el BOM de Spring Boot. El schema BFF (me { accounts,
# balances, transfers }) agrega los REST internos vía WebClient reactivo con propagación de token.
spring-boot-starter-graphql = { module = "org.springframework.boot:spring-boot-starter-graphql" }
# Helpers de test para GraphQL: HttpGraphQlTester/GraphQlTester y el soporte @GraphQlTest.
spring-graphql-test = { module = "org.springframework.graphql:spring-graphql-test" }

# Observabilidad — métricas (tarea 11.1, Requisito 11, criterios 1 y 2). El registro de
# Micrometer para Prometheus expone las métricas de la aplicación (JVM, HTTP server, JDBC/HikariCP,
# Kafka, etc.) en formato de exposición de Prometheus vía el endpoint de Actuator
# /actuator/prometheus, scrapeable por el Prometheus del stack de infra. La versión la gestiona el
# BOM de Spring Boot (alineada con la versión de Micrometer que trae Spring Boot 3.3.6), por eso no
# se fija aquí.
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }

# Observabilidad — trazas distribuidas (tarea 11.2, Requisito 11, criterio 3). Puente de
# Micrometer Tracing hacia la API de OpenTelemetry: instrumenta automáticamente los bordes
# (HTTP server/cliente WebClient/RestTemplate y consumidores/productores de Kafka), crea los
# spans y propaga el contexto de traza (W3C traceparent en HTTP; headers en Kafka) para que la
# traza cruce gateway → transfer → ledger. El exporter OTLP envía los spans por OTLP/HTTP al
# collector de Jaeger (all-in-one con receiver OTLP). Ambas versiones las gestiona el BOM de
# Spring Boot 3.3.6 (Micrometer Tracing BOM + OpenTelemetry BOM), por eso no se fijan aquí.
micrometer-tracing-bridge-otel = { module = "io.micrometer:micrometer-tracing-bridge-otel" }
opentelemetry-exporter-otlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp" }

# Observabilidad — logs estructurados a Loki (tarea 11.3, Requisito 11, criterio 4). Appender de
# Logback (loki4j) que envía cada evento de log en JSON a Loki vía HTTP push. Se activa desde el
# logback-spring.xml de cada servicio (perfil !test) e incluye por MDC los campos traceId y spanId
# que Micrometer Tracing ya popula, habilitando la correlación logs ↔ trazas por trace-id en Grafana.
loki-logback-appender = { module = "com.github.loki4j:loki-logback-appender", version.ref = "loki4j" }

# Testcontainers
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql" }
testcontainers-kafka = { module = "org.testcontainers:kafka" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
