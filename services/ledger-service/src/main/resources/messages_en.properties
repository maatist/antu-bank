field.reference.size=The reference must not exceed 100 characters.
field.currency.notnull=Currency is required.
field.entries.notempty=The transaction must include entries.
field.entries.min=The transaction requires at least two entries.
field.entry.accountId.notnull=The entry account is required.
field.entry.type.notnull=The entry type (debit/credit) is required.
field.entry.amount.notnull=The entry amount is required.
field.entry.amount.positive=The entry amount must be a positive integer.
