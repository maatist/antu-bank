# English messages - ledger-service

error.validation.title=Validation error
error.validation.detail=The request contains invalid data.

error.unbalanced.title=Unbalanced transaction
error.unbalanced.detail=The transaction entries must sum to exactly zero (sum of debits = sum of credits).

error.transaction.invalid.title=Invalid transaction
error.transaction.invalid=The transaction does not satisfy the accounting rules (at least two entries, single currency and positive amounts).

error.internal.title=Internal error
error.internal.detail=An unexpected error occurred. Please try again later.

