spring:
  application:
    name: notification-service

  # Kafka: consumer de los eventos notificables. Se suscribe a dos topics —transfer.events (evento
  # TransferConfirmed de transfer-service) y fraud.events (evento TransferFlagged de fraud-service)—
  # y filtra por el header eventType (tarea 7.2, Requisito 7, criterios 3 y 4). El servicio no
  # produce eventos: solo consume. El payload viaja como JSON (String) y el tipo/versión del evento
  # como headers de Kafka (eventType / eventVersion). Por defecto apunta al broker local
  # (localhost:9092), con override por entorno para despliegues.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # Grupo de consumo del notification-service: cada evento lo notifica una única instancia.
      group-id: ${KAFKA_CONSUMER_GROUP_ID:notification-service}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Al no haber offset comprometido, leer desde el inicio para no perder eventos previos.
      auto-offset-reset: earliest

  # Internacionalización: contenido de notificaciones en español (por defecto) e inglés
  # (Requisito 7, criterio 4). El basename apunta a messages[_en].properties del classpath.
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

server:
  port: ${NOTIFICATION_SERVICE_PORT:8086}

# Configuración de la notificación (tarea 7.2, Requisito 7, criterios 3 y 4).
notification:
  # Locale por defecto para el contenido de las notificaciones. Como no hay request HTTP con
  # cabecera Accept-Language desde el que derivar el idioma, se usa este locale por defecto
  # (es-CL, banca chilena). Queda como punto de extensión (hook) para, más adelante, resolver el
  # idioma por preferencia del usuario a partir de los datos del evento.
  default-locale: ${NOTIFICATION_DEFAULT_LOCALE:es-CL}
  events:
    # Topic de eventos de transferencia (debe coincidir con outbox.relay.topic de transfer-service).
    transfer-topic: ${TRANSFER_EVENTS_TOPIC:transfer.events}
    # Topic de eventos de fraude (debe coincidir con fraud.events.topic de fraud-service).
    fraud-topic: ${FRAUD_EVENTS_TOPIC:fraud.events}

management:
  endpoints:
    web:
      exposure:
        # Observabilidad (tarea 11.1, Requisito 11, criterio 1): se expone el endpoint
        # /actuator/prometheus para que Prometheus scrapee las métricas de Micrometer.
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      # Etiqueta común aplicada a todas las métricas: permite filtrar/agrupar por servicio en los
      # dashboards de Grafana (latencia, errores, throughput) — Requisito 11, criterio 2.
      application: ${spring.application.name}
    distribution:
      # Habilita histogramas nativos de percentiles para la latencia de las peticiones HTTP server,
      # de modo que Grafana pueda calcular p95/p99 con histogram_quantile sobre http_server_requests.
      percentiles-histogram:
        http.server.requests: true
  # Observabilidad — trazas distribuidas OpenTelemetry → Jaeger (tarea 11.2, Requisito 11, criterio 3).
  # Micrometer Tracing (puente OTel) instrumenta el consumer Kafka, continuando la traza propagada en
  # los headers del evento para correlacionar la notificación dentro de la misma traza distribuida.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      # Exporter OTLP/HTTP hacia el receiver OTLP de Jaeger all-in-one (puerto 4318, path /v1/traces).
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
