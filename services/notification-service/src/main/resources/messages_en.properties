# English messages - notification-service
# Localizable notification content (Requirement 7, criterion 4).

# Completed transfer (TransferConfirmed event).
notification.transfer.confirmed.subject=Transfer completed successfully
notification.transfer.confirmed.body=Your transfer of {0} was completed successfully.

# Transfer flagged as suspicious (TransferFlagged event).
notification.transfer.flagged.subject=Alert: suspicious transfer detected
notification.transfer.flagged.body=We detected a suspicious transfer of {0}. Reason: {1}.

# Localized flag reasons used in the alert body.
notification.reason.HIGH_AMOUNT=high amount exceeding the risk threshold
notification.reason.VELOCITY_COUNT=too many transfers in a short period
notification.reason.VELOCITY_AMOUNT=high cumulative amount in a short period
