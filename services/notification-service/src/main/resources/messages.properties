# Mensajes en espanol (idioma por defecto, es-CL) - notification-service
# Nota: archivo en ISO-8859-1 por convencion de .properties; se evitan tildes en el texto.
# Contenido localizable de las notificaciones (Requisito 7, criterio 4).

# Transferencia completada (evento TransferConfirmed).
notification.transfer.confirmed.subject=Transferencia realizada con exito
notification.transfer.confirmed.body=Tu transferencia por {0} se realizo correctamente.

# Transferencia marcada como sospechosa (evento TransferFlagged).
notification.transfer.flagged.subject=Alerta: transferencia sospechosa detectada
notification.transfer.flagged.body=Detectamos una transferencia sospechosa por {0}. Motivo: {1}.

# Motivos del marcado (localizados) usados en el cuerpo de la alerta.
notification.reason.HIGH_AMOUNT=monto elevado que supera el umbral de riesgo
notification.reason.VELOCITY_COUNT=demasiadas transferencias en un periodo corto
notification.reason.VELOCITY_AMOUNT=monto acumulado elevado en un periodo corto
