apiVersion: v2
name: antu-bank
description: >-
  Chart Helm de NeoBank (Antu Bank) para desplegar el stack completo y fiel de
  microservicios Spring Boot (Java 21) + Keycloak sobre Kubernetes/EKS.
  Honra database-per-service estricto (una RDS por servicio) y Kafka gestionado
  vía MSK (SASL). Ejecutable on-demand (Requisito 12, criterios 5 y 7).
type: application
# Versión del chart (SemVer). Se incrementa al cambiar las plantillas.
version: 0.1.0
# Versión de la aplicación desplegada (referencial; el tag real se fija en values.image.tag).
appVersion: "1.0.0"
keywords:
  - neobank
  - antu-bank
  - microservices
  - spring-boot
  - eks
home: https://github.com/matias/antu-bank
maintainers:
  - name: Antu Bank
