{{/*
=============================================================================
Service (ClusterIP) por microservicio.
Expone el puerto HTTP del pod dentro del clúster para tráfico interno
(gateway → servicios, y consumo por el BFF GraphQL). El acceso público se
resuelve por el Ingress del api-gateway (ingress.yaml).
El nombre del Service es <fullname>-<svcName>, estable, para que las URIs
internas configuradas en el gateway/transfer lo resuelvan por DNS del clúster.
=============================================================================
*/}}
{{- $root := . -}}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "antu-bank.service.fullname" (dict "root" $root "name" $name) }}
  labels:
    {{- include "antu-bank.service.labels" (dict "root" $root "name" $name) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "antu-bank.service.selectorLabels" (dict "root" $root "name" $name) | nindent 4 }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
      protocol: TCP
{{- end }}
{{- end }}
