{{/*
=============================================================================
Deployment por microservicio.
  - Imagen parametrizada (registry/repository/tag) vía values.
  - envFrom: ConfigMap (no sensible) + Secret (sensible, propio o existente).
  - Probes liveness/readiness/startup contra /actuator/health (Spring Boot Actuator).
  - Recursos (requests/limits) configurables por servicio con default global.
  - Anotaciones de scrape de Prometheus (/actuator/prometheus) — Requisito 11.
=============================================================================
*/}}
{{- $root := . -}}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $ctx := dict "root" $root "name" $name "svc" $svc -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "antu-bank.service.fullname" (dict "root" $root "name" $name) }}
  labels:
    {{- include "antu-bank.service.labels" (dict "root" $root "name" $name) | nindent 4 }}
spec:
  replicas: {{ default $root.Values.replicaCount $svc.replicaCount }}
  selector:
    matchLabels:
      {{- include "antu-bank.service.selectorLabels" (dict "root" $root "name" $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "antu-bank.service.labels" (dict "root" $root "name" $name) | nindent 8 }}
      annotations:
        {{- if $root.Values.metrics.podAnnotations.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/path: {{ $root.Values.metrics.path | quote }}
        prometheus.io/port: {{ $svc.port | quote }}
        {{- end }}
        {{- with $svc.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "antu-bank.service.image" $ctx | quote }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          {{- with $root.Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "antu-bank.service.fullname" (dict "root" $root "name" $name) }}
            {{- if $svc.existingSecret }}
            - secretRef:
                name: {{ $svc.existingSecret }}
            {{- else if $svc.secretEnv }}
            - secretRef:
                name: {{ include "antu-bank.service.fullname" (dict "root" $root "name" $name) }}
            {{- end }}
          {{- with $svc.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            httpGet:
              path: {{ $root.Values.probes.path }}
              port: http
            failureThreshold: {{ $root.Values.probes.startup.failureThreshold }}
            periodSeconds: {{ $root.Values.probes.startup.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ $root.Values.probes.path }}
              port: http
            initialDelaySeconds: {{ $root.Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ $root.Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ $root.Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ $root.Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ $root.Values.probes.path }}
              port: http
            initialDelaySeconds: {{ $root.Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ $root.Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ $root.Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ $root.Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml (default $root.Values.resources $svc.resources) | nindent 12 }}
      {{- with $root.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
