{{/*
=============================================================================
Secret por microservicio: variables de entorno SENSIBLES (credenciales).
  - Password de la RDS del servicio (p. ej. ACCOUNT_DB_PASSWORD).
  - JAAS config de Kafka/MSK (SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG), que contiene el secreto SASL.

MANEJO DE SECRETOS (NUNCA hardcodear):
  - PREFERIDO en producción/EKS: crear el Secret FUERA del chart (kubectl create secret,
    External Secrets Operator, AWS Secrets Manager, SealedSecrets) y referenciarlo con
    `svc.existingSecret: <nombre>`. En ese caso este template NO genera Secret alguno.
  - Alternativa para pruebas: definir `svc.secretEnv` en un values LOCAL (nunca versionado
    con valores reales) para que el chart genere el Secret. values.example.yaml solo trae
    PLACEHOLDERS, jamás credenciales reales.
=============================================================================
*/}}
{{- $root := . -}}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- if and (not $svc.existingSecret) $svc.secretEnv }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "antu-bank.service.fullname" (dict "root" $root "name" $name) }}
  labels:
    {{- include "antu-bank.service.labels" (dict "root" $root "name" $name) | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := $svc.secretEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
