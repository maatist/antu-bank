# Proveedor de dashboards aprovisionados (tarea 11.1, Requisito 11, criterio 2).
# Carga los JSON de dashboards desde /var/lib/grafana/dashboards (montado desde
# infra/grafana/dashboards en docker-compose.yml).
apiVersion: 1

providers:
  - name: Antu Bank
    orgId: 1
    folder: Antu Bank
    type: file
    disableDeletion: false
    editable: true
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
